name: Build & Release

on:
  push:
    branches:
      - 'main'
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        type: boolean
        default: true
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore packages
      run: dotnet restore src/ComIpBridge.csproj

    - name: Build
      run: dotnet build src/ComIpBridge.csproj -c Release --no-restore

    - name: Publish (Self-contained Single File)
      run: |
        dotnet publish src/ComIpBridge.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -o publish

    - name: Install Inno Setup
      run: |
        choco install innosetup -y --no-progress
      shell: cmd

    - name: Build Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss
      shell: pwsh

    - name: Create ZIP (Portable)
      run: |
        Compress-Archive -Path publish\* -DestinationPath ComIpBridge_Portable_win-x64.zip
      shell: pwsh

    - name: Upload Portable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: ComIpBridge_Portable
        path: ComIpBridge_Portable_win-x64.zip

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: ComIpBridge_Installer
        path: installer/Output/*.exe

    - name: Create Release
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
        name: "COM-IP Bridge ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}"
        make_latest: true
        body: |
          ## COM-IP Bridge - 멀티포트 시리얼 브릿지

          멀티포트 COM ↔ TCP/IP 브릿지 프로그램

          ### 다운로드
          - **설치 파일** (권장): `ComIpBridge_Setup_*.exe` - 설치 마법사로 간편 설치
          - **포터블**: `ComIpBridge_Portable_win-x64.zip` - 설치 없이 바로 실행

          ### 주요 기능
          - 멀티포트 동시 운영 (개수 제한 없음)
          - TCP Server / Client / UDP 모드
          - 자동 재연결, 데이터 모니터
          - 시스템 트레이 백그라운드 실행
          - 설정 저장/내보내기

          ### 시스템 요구사항
          - Windows 10/11 (64-bit)
          - .NET 런타임 불필요 (자체 포함)
        files: |
          ComIpBridge_Portable_win-x64.zip
          installer/Output/*.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
